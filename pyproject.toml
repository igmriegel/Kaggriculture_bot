[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kaggriculture-bot"
version = "0.1.0"
description = "A reproducible harness and extensible agent for Kaggriculture."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.11,<3",
    "numpy>=1.26,<3",
    "scipy>=1.11,<2",
    "scikit-learn>=1.9.0",
    "joblib>=1.6.0",
]

[dependency-groups]
dev = [
    "pre-commit>=4.2,<5",
    "pytest>=8.3,<9",
    "ruff>=0.12,<0.13",
    "ty>=0.0.1a0",
]
competition = [
    "cmaes>=0.13.1",
    "kaggle-environments>=1.18,<2",
    "optuna>=4.9.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["docs/reference", "*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.uv]
default-groups = ["dev"]

[tool.hatch.build.targets.wheel]
packages = ["agent"]
