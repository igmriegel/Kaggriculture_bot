repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.12.10
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/astral-sh/ty-pre-commit
    rev: 0.0.1-alpha.1
    hooks:
      - id: ty-check
        args: [agent, tests]
  - repo: https://github.com/pytest-dev/pytest
    rev: 8.3.5
    hooks:
      - id: pytest
